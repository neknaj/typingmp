name: CI, Release, and Deploy

on:
  pull_request:
  push:
    branches:
      - main

env:
  APP_NAME: rust_multibackend_app
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check text encoding
        shell: pwsh
        run: ./scripts/check_text_encoding.ps1

      - name: Check formatting
        run: cargo fmt --check

      - name: Test dev server path guard
        run: npm run test:serve

      - name: Run core tests
        run: cargo test --no-default-features

      - name: Run core clippy
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-check
            targets: x86_64-unknown-linux-gnu
            command: cargo check --no-default-features
          - name: tui-clippy
            targets: x86_64-unknown-linux-gnu
            command: cargo clippy --no-default-features --features tui --all-targets -- -D warnings
          - name: gui-clippy
            targets: x86_64-unknown-linux-gnu
            command: cargo clippy --no-default-features --features gui --all-targets -- -D warnings
          - name: mobile-clippy
            targets: x86_64-unknown-linux-gnu
            command: cargo clippy --no-default-features --features mobile --all-targets -- -D warnings
          - name: wasm-debug-check
            targets: wasm32-unknown-unknown
            command: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
          - name: wasm-release-check
            targets: wasm32-unknown-unknown
            command: cargo check --release --target wasm32-unknown-unknown --no-default-features --features wasm
          - name: wasi-tui-wasip1-check
            targets: wasm32-wasip1
            command: cargo check --target wasm32-wasip1 --no-default-features --features wasi-tui
          - name: wasi-tui-wasip2-check
            targets: wasm32-wasip2
            command: cargo check --target wasm32-wasip2 --no-default-features --features wasi-tui
          - name: uefi-no-std-check
            targets: x86_64-unknown-uefi
            command: cargo check --target x86_64-unknown-uefi --no-default-features --features uefi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.targets }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Run matrix check
        run: ${{ matrix.command }}

  build-binaries:
    name: Build Binaries
    needs: [quality, feature-matrix]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            builder: cargo
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            builder: cross
            ext: ""
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            builder: cross
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            builder: cargo
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            builder: cargo
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builder: cargo
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --branch main

      - name: Build TUI
        shell: bash
        run: ${{ matrix.builder }} build --release --no-default-features --features tui --target ${{ matrix.target }}

      - name: Rename TUI artifact
        shell: bash
        run: mv target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.ext }} ./tui-artifact${{ matrix.ext }}

      - name: Build GUI
        shell: bash
        run: ${{ matrix.builder }} build --release --no-default-features --features gui --target ${{ matrix.target }}

      - name: Rename GUI artifact
        shell: bash
        run: mv target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.ext }} ./gui-artifact${{ matrix.ext }}

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ./tui-artifact${{ matrix.ext }}
            ./gui-artifact${{ matrix.ext }}

  build-uefi:
    name: Build UEFI
    needs: [quality, feature-matrix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Build UEFI binary
        run: cargo build --release --target x86_64-unknown-uefi --no-default-features --features uefi

      - name: Upload UEFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-binary
          path: target/x86_64-unknown-uefi/release/${{ env.APP_NAME }}.efi

  build-wasm:
    name: Build WASM
    needs: [quality, feature-matrix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        run: wasm-pack build --target web --release -- --no-default-features --features wasm

      - name: Prepare Pages directory
        run: |
          mkdir dist
          mkdir -p dist/fonts
          cp pkg/rust_multibackend_app_bg.wasm dist/
          cp pkg/rust_multibackend_app.js dist/
          cp fonts/YujiSyuku-Regular.ttf dist/fonts/
          cp fonts/NotoSerifJP-Regular.ttf dist/fonts/
          cp index.html dist/
          sed -i 's|./pkg/rust_multibackend_app.js|./rust_multibackend_app.js|' dist/index.html

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-artifact
          path: dist

  build-wasi-tui:
    name: Build WASI TUI
    needs: [quality, feature-matrix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-wasip2

      - name: Build WASIp1 TUI
        run: cargo build --release --bin ${{ env.APP_NAME }} --target wasm32-wasip1 --no-default-features --features wasi-tui

      - name: Build WASIp2 TUI
        run: cargo build --release --bin ${{ env.APP_NAME }} --target wasm32-wasip2 --no-default-features --features wasi-tui

      - name: Prepare WASI artifacts
        run: |
          mkdir wasi-artifacts
          cp target/wasm32-wasip1/release/${{ env.APP_NAME }}.wasm wasi-artifacts/${{ env.APP_NAME }}-tui-wasm32-wasip1.wasm
          cp target/wasm32-wasip2/release/${{ env.APP_NAME }}.wasm wasi-artifacts/${{ env.APP_NAME }}-tui-wasm32-wasip2.wasm

      - name: Upload WASI TUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasi-tui-artifacts
          path: wasi-artifacts/*.wasm

  release:
    name: Create Release
    needs: [build-binaries, build-uefi, build-wasi-tui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release version
        run: echo "version=v$(date +'%Y%m%d.%H%M%S')" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize files
        run: |
          mkdir release-files
          find artifacts -type f -name "tui-artifact*" | while read -r file; do
            target_name=$(basename "$(dirname "$file")" | sed 's/binaries-//')
            ext=$(echo "$file" | grep -oE '\.[^.]*$|')
            mv "$file" "release-files/${{ env.APP_NAME }}-tui-${target_name}${ext}"
          done
          find artifacts -type f -name "gui-artifact*" | while read -r file; do
            target_name=$(basename "$(dirname "$file")" | sed 's/binaries-//')
            ext=$(echo "$file" | grep -oE '\.[^.]*$|')
            mv "$file" "release-files/${{ env.APP_NAME }}-gui-${target_name}${ext}"
          done
          find artifacts -type f -name "${{ env.APP_NAME }}-tui-wasm32-wasip*.wasm" | while read -r file; do
            mv "$file" "release-files/$(basename "$file")"
          done
          mv artifacts/uefi-binary/${{ env.APP_NAME }}.efi release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-wasm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-artifact
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
