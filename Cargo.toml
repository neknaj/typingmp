[package]
name = "rust_multibackend_app"
version = "0.1.1"
edition = "2021"

# wasm-bindgen builds require a library crate.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# No backend feature is enabled by default.
default = []
# GUI enables native window and pixel rendering dependencies.
gui = [
    "dep:winit",
    "dep:pixels",
]
gui-file = [
    "gui",
    "dep:rfd",              # native file dialog
]
tui = ["dep:crossterm"]
wasm = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "getrandom/js"
]
uefi = ["dep:uefi", "dep:log", "dep:core_maths"]
mobile = ["dep:slint"]

[dependencies]
ab_glyph = { version = "0.2.31", default-features = false, features = ["libm"] }
slint = { version = "1", optional = true }
phf = { version = "0.13", features = ["macros"], default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["once"] }

# Optional backend dependencies.
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
crossterm = { version = "0.29.0", optional = true }
core_maths = { version = "0.1.1", optional = true }


# GUI backend
winit = { version = "0.28", optional = true, default-features = false, features = ["x11"] }
pixels = { version = "0.14", optional = true }


# Optional WASM dependencies.
wasm-bindgen = { version = "0.2.87", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
getrandom = { version = "0.2", optional = true, features = ["js"] }

# Optional UEFI dependencies.
uefi = { version = "0.35.0", optional = true, features = ["alloc", "panic_handler", "logger" ] }
log = { version = "0.4", optional = true }

[dependencies.web-sys]
version = "0.3.64"
optional = true
features = [
    'Document',
    'Window',
    'Element',
    'HtmlCanvasElement',
    'HtmlInputElement',
    'InputEvent',
    'CanvasRenderingContext2d',
    'ImageData',
    'Blob',
    'Url',
    'KeyboardEvent',
    'WebSocket',
    'ErrorEvent',
    'CloseEvent',
    'console',
    'FileReader',
    'ProgressEvent',
    'File',
    'FileList',
    'Storage',
    'EventTarget',
    'HtmlElement',
    'CssStyleDeclaration',
    'PointerEvent',
    'WheelEvent',
    'AddEventListenerOptions',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
]


# UEFI cannot unwind across firmware boundaries, so abort on panic.
[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"


[build-dependencies]
slint-build = { version = "1" }

# Extra dependencies needed only when compiling for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
