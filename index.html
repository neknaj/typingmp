<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Neknaj Typing Multi-Platform wasm edition</title>
    <meta property="og:title" content="Neknaj Typing Multi-Platform wasm edition">
    <meta property="og:description" content="クロスプラットフォーム対応のタイピング練習アプリケーションです。">
    <meta property="og:type" content="website">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        html {
            height: 100%;
        }
        body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;

            background-color: #101010;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-wrapper {
            flex-grow: 1;
            flex-shrink: 1;
            width: 100%;
            min-height: 0;
            display: flex;
        }

        canvas {
            width: 100%;
            margin: auto 0;
            max-height: 100%;
        }

        input {
            position: absolute;
            top: -100px;
            left: -100px;
            opacity: 0;
            width: fit-content;
            height: 100px;
        }

        #controls-container {
            display: none;
            flex-shrink: 0;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #1a1a1a;
            justify-content: space-around;
            align-items: center;
            gap: 5px;
        }

        #controls-container button {
            flex-grow: 1;
            padding: 15px 5px;
            font-size: 1.5em;
            background-color: #444;
            color: #eee;
            border: 1px solid #666;
            border-radius: 8px;
            touch-action: manipulation;
        }

        /* キーボード切替ボタン: やや小さめで右端に固定 */
        #key-kb-toggle {
            flex-grow: 0;
            flex-shrink: 0;
            padding: 8px 10px;
            font-size: 0.8em;
            background-color: #2a3a4a;
            border-color: #446;
            white-space: nowrap;
        }

        @media (orientation: portrait) {
            #controls-container {
                display: flex;
            }
        }

        .description {
            opacity: 0;
        }

        #link-container {
            position: fixed;
            top: 10px;
            left: 10px;
            font-family: sans-serif;
            font-size: 12px;
            color: #aaa;
        }
        #link-container a {
            color: #6277a5;
        }
        #link-container a:hover {
            color: #fff;
        }
        #link-container p {
            margin: 5px 0 0 0;
            padding: 0;
        }

        /* フリックキーボード */
        #flick-keyboard {
            display: none; /* JS で表示制御 */
            flex-shrink: 0;
            width: 100%;
            background-color: #1a1a1a;
            padding: 4px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .flick-row {
            display: flex;
            width: 100%;
            gap: 3px;
            margin-bottom: 3px;
        }

        .flick-key {
            flex: 1;
            position: relative;
            height: 58px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 4.5vw, 22px);
            color: #eee;
            touch-action: none;
            cursor: pointer;
            transition: background-color 0.05s;
        }

        .flick-key.pressing {
            background-color: #556;
        }

        /* フリック方向プレビュー */
        .flick-preview {
            position: absolute;
            font-size: 0.65em;
            color: #aaa;
            pointer-events: none;
        }
        .flick-preview.top    { top: 2px;    left: 50%; transform: translateX(-50%); }
        .flick-preview.right  { right: 3px;  top: 50%;  transform: translateY(-50%); }
        .flick-preview.bottom { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .flick-preview.left   { left: 3px;   top: 50%;  transform: translateY(-50%); }

        .flick-key-label {
            font-weight: bold;
        }

        /* 特殊キー（BS、Enterなど）は列を広げる */
        .flick-key.wide {
            flex: 1.5;
        }
    </style>
</head>

<body>

    <div id="canvas-wrapper">
        <!-- CanvasはRustコードによってここに追加される -->
    </div>

    <p class="description">
        クロスプラットフォーム対応のタイピング練習アプリケーションです。
    </p>

    <!-- 通常コントロールボタン（縦向き時） -->
    <div id="controls-container">
        <button id="key-up">▲</button>
        <button id="key-down">▼</button>
        <button id="key-enter">Enter</button>
        <button id="key-backspace">BS</button>
        <button id="key-esc">Esc</button>
        <!-- キーボードモード切替: フリック(アプリ提供) ↔ OS IME -->
        <button id="key-kb-toggle" title="キーボード切替">⌨</button>
    </div>

    <!-- フリックキーボード（タッチデバイスのタイピング中）
         3列レイアウト: mobile.slint と統一
         フリック方向: 上=う段, 左=い段, 右=え段, 下=お段 -->
    <div id="flick-keyboard">
        <!-- Row 1: あ か さ -->
        <div class="flick-row">
            <div class="flick-key" data-center="あ" data-up="う" data-left="い" data-right="え" data-down="お">
                <span class="flick-preview top">う</span>
                <span class="flick-preview left">い</span>
                <span class="flick-preview right">え</span>
                <span class="flick-preview bottom">お</span>
                <span class="flick-key-label">あ</span>
            </div>
            <div class="flick-key" data-center="か" data-up="く" data-left="き" data-right="け" data-down="こ">
                <span class="flick-preview top">く</span>
                <span class="flick-preview left">き</span>
                <span class="flick-preview right">け</span>
                <span class="flick-preview bottom">こ</span>
                <span class="flick-key-label">か</span>
            </div>
            <div class="flick-key" data-center="さ" data-up="す" data-left="し" data-right="せ" data-down="そ">
                <span class="flick-preview top">す</span>
                <span class="flick-preview left">し</span>
                <span class="flick-preview right">せ</span>
                <span class="flick-preview bottom">そ</span>
                <span class="flick-key-label">さ</span>
            </div>
        </div>
        <!-- Row 2: た な は -->
        <div class="flick-row">
            <div class="flick-key" data-center="た" data-up="つ" data-left="ち" data-right="て" data-down="と">
                <span class="flick-preview top">つ</span>
                <span class="flick-preview left">ち</span>
                <span class="flick-preview right">て</span>
                <span class="flick-preview bottom">と</span>
                <span class="flick-key-label">た</span>
            </div>
            <div class="flick-key" data-center="な" data-up="ぬ" data-left="に" data-right="ね" data-down="の">
                <span class="flick-preview top">ぬ</span>
                <span class="flick-preview left">に</span>
                <span class="flick-preview right">ね</span>
                <span class="flick-preview bottom">の</span>
                <span class="flick-key-label">な</span>
            </div>
            <div class="flick-key" data-center="は" data-up="ふ" data-left="ひ" data-right="へ" data-down="ほ">
                <span class="flick-preview top">ふ</span>
                <span class="flick-preview left">ひ</span>
                <span class="flick-preview right">へ</span>
                <span class="flick-preview bottom">ほ</span>
                <span class="flick-key-label">は</span>
            </div>
        </div>
        <!-- Row 3: ま や ら -->
        <div class="flick-row">
            <div class="flick-key" data-center="ま" data-up="む" data-left="み" data-right="め" data-down="も">
                <span class="flick-preview top">む</span>
                <span class="flick-preview left">み</span>
                <span class="flick-preview right">め</span>
                <span class="flick-preview bottom">も</span>
                <span class="flick-key-label">ま</span>
            </div>
            <!-- や行: ゆ(上), ゃ(左/小文字), ゅ(右/小文字), よ(下) -->
            <div class="flick-key" data-center="や" data-up="ゆ" data-left="ゃ" data-right="ゅ" data-down="よ">
                <span class="flick-preview top">ゆ</span>
                <span class="flick-preview left">ゃ</span>
                <span class="flick-preview right">ゅ</span>
                <span class="flick-preview bottom">よ</span>
                <span class="flick-key-label">や</span>
            </div>
            <div class="flick-key" data-center="ら" data-up="る" data-left="り" data-right="れ" data-down="ろ">
                <span class="flick-preview top">る</span>
                <span class="flick-preview left">り</span>
                <span class="flick-preview right">れ</span>
                <span class="flick-preview bottom">ろ</span>
                <span class="flick-key-label">ら</span>
            </div>
        </div>
        <!-- Row 4: ⌫  わ(+を/ん)  。(+？/！/…/、)  Enter -->
        <div class="flick-row">
            <div class="flick-key wide" id="flick-bs" style="font-size:1.1em;">⌫</div>
            <div class="flick-key" data-center="わ" data-left="を" data-down="ん">
                <span class="flick-preview left">を</span>
                <span class="flick-preview bottom">ん</span>
                <span class="flick-key-label">わ</span>
            </div>
            <div class="flick-key" data-center="。" data-up="？" data-left="、" data-right="！" data-down="…">
                <span class="flick-preview top">？</span>
                <span class="flick-preview left">、</span>
                <span class="flick-preview right">！</span>
                <span class="flick-preview bottom">…</span>
                <span class="flick-key-label">。</span>
            </div>
            <div class="flick-key wide" id="flick-enter" style="background:#223355; font-size:0.85em;">Enter</div>
        </div>
    </div>

    <div id="link-container">
        <a href="https://github.com/neknaj/typingmp" target="_blank" rel="noopener noreferrer">Source Code on GitHub</a>
        <p>(Desktop versions also available)</p>
    </div>

</body>

</html>
<script type="module">
    import init, { trigger_event, take_file_open_request, send_char, is_typing_active } from './pkg/rust_multibackend_app.js';

    // --- キーボードモード管理 ---
    // localStorage に保存し、次回起動時に復元する。
    // "app"  : アプリ提供のフリックキーボードを使用 (OSキーボードを抑制)
    // "device": デバイス標準キーボード(OS IME)を使用
    const LS_KB_KEY = 'typingmp_kb_mode';
    let useAppKeyboard = (localStorage.getItem(LS_KB_KEY) ?? 'app') === 'app';
    let hiddenInput = null; // WASM init後に取得

    const applyKeyboardMode = () => {
        if (hiddenInput) {
            if (useAppKeyboard) {
                // inputmode="none" でOSキーボードを抑制しつつ focus は維持できる
                hiddenInput.setAttribute('inputmode', 'none');
                hiddenInput.blur();
            } else {
                hiddenInput.setAttribute('inputmode', 'text');
            }
        }
        const btn = document.getElementById('key-kb-toggle');
        if (btn) {
            btn.textContent = useAppKeyboard ? '⌨フリック' : '⌨OS';
            btn.style.borderColor = useAppKeyboard ? '#44aa66' : '#446';
        }
        localStorage.setItem(LS_KB_KEY, useAppKeyboard ? 'app' : 'device');
    };

    async function run() {
        await init();

        // WASM が body に追加する hidden input を取得
        hiddenInput = document.querySelector('input[type="text"]');
        if (hiddenInput) {
            // app キーボードモード時: Rust の pointerdown → input.focus() を即 blur で打ち消す
            // これによりOSキーボードが表示されない
            hiddenInput.addEventListener('focus', () => {
                if (useAppKeyboard) {
                    // setTimeout(0) で Rust の focus 呼び出し完了後に blur
                    setTimeout(() => hiddenInput && hiddenInput.blur(), 0);
                }
            });
        }
        applyKeyboardMode(); // 保存済みモードを適用

        // キーボード切替ボタン
        document.getElementById('key-kb-toggle').addEventListener('mousedown', (e) => {
            e.preventDefault();
            useAppKeyboard = !useAppKeyboard;
            applyKeyboardMode();
        });

        const copyToClipboardOnce = async () => {
            try {
                await navigator.clipboard.writeText('Neknaj Typing MP wasm edition');
            } catch (err) {}
        };
        document.body.addEventListener('pointerdown', copyToClipboardOnce, { once: true });

        const adjustHeight = () => {
            if (window.visualViewport) {
                document.body.style.height = `${window.visualViewport.height}px`;
            }
        };
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', adjustHeight);
            adjustHeight();
        }

        // --- ナビゲーションボタン ---
        document.getElementById('key-up').addEventListener('mousedown', (e) => { e.preventDefault(); trigger_event('Up'); });
        document.getElementById('key-down').addEventListener('mousedown', (e) => { e.preventDefault(); trigger_event('Down'); });
        document.getElementById('key-enter').addEventListener('mousedown', (e) => {
            e.preventDefault();
            trigger_event('Enter');
            if (take_file_open_request()) {
                document.getElementById('problem-file-input').click();
            }
        });
        document.getElementById('key-backspace').addEventListener('mousedown', (e) => { e.preventDefault(); trigger_event('Backspace'); });
        document.getElementById('key-esc').addEventListener('mousedown', (e) => { e.preventDefault(); trigger_event('Escape'); });

        // --- フリックキーボード表示制御 ---
        const flickKeyboard = document.getElementById('flick-keyboard');
        const controlsContainer = document.getElementById('controls-container');
        const isTouchDevice = navigator.maxTouchPoints > 0;

        // アニメーションフレームごとにタイピング中かどうかで表示切替。
        // useAppKeyboard=true  かつタイピング中: フリックキーボード表示、ナビボタン非表示
        // useAppKeyboard=false またはタイピング外: フリックキーボード非表示、ナビボタン通常
        const updateKeyboardVisibility = () => {
            if (isTouchDevice) {
                const typing = is_typing_active();
                const showFlick = typing && useAppKeyboard;
                flickKeyboard.style.display = showFlick ? 'block' : 'none';
                controlsContainer.style.display = showFlick ? 'none' : '';
            }
            requestAnimationFrame(updateKeyboardVisibility);
        };
        requestAnimationFrame(updateKeyboardVisibility);

        // --- フリックキーボードのジェスチャー検出 ---
        const FLICK_THRESHOLD = 20; // px

        const flickKeys = document.querySelectorAll('.flick-key[data-center]');
        flickKeys.forEach(key => {
            let startX = 0, startY = 0;

            key.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                key.classList.add('pressing');
                key.setPointerCapture(e.pointerId);
            });

            key.addEventListener('pointerup', (e) => {
                e.preventDefault();
                key.classList.remove('pressing');

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                let char;
                if (dist < FLICK_THRESHOLD) {
                    // タップ → センター文字
                    char = key.dataset.center;
                } else if (Math.abs(dy) > Math.abs(dx)) {
                    // 縦フリック
                    char = dy < 0 ? key.dataset.up : key.dataset.down;
                } else {
                    // 横フリック
                    char = dx > 0 ? key.dataset.right : key.dataset.left;
                }

                if (char) send_char(char);
            });

            key.addEventListener('pointercancel', () => {
                key.classList.remove('pressing');
            });
        });

        // 特殊キー（BS / Enter）
        document.getElementById('flick-bs').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            trigger_event('Backspace');
        });
        document.getElementById('flick-enter').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            trigger_event('Enter');
            if (take_file_open_request()) {
                document.getElementById('problem-file-input').click();
            }
        });
    }

    run();
</script>
